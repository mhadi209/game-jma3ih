name: بناء التطبيق ونشره في Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: نسخ ملفات اللعبة داخل التطبيق
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r *.html *.js manifest.webmanifest icons android/app/src/main/assets/www/
          if [ -d img ]; then cp -r img android/app/src/main/assets/www/; fi

      - name: بناء ملف APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: تجهيز الملفات
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/taqzeera.apk
          zip -r out/taqzeera-web.zip *.html *.js manifest.webmanifest icons $(ls -d img 2>/dev/null)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: تقزيرة v1.${{ github.run_number }}
          make_latest: true
          files: out/*
          body: |
            ## 📲 التحميل
            - **أندرويد:** نزّل `taqzeera.apk` وافتحه، واسمح بالتثبيت من مصادر غير معروفة إذا طلب منك.
            - **نسخة الويب:** `taqzeera-web.zip` (تفتح من المتصفح).

            📺 شاشة التلفزيون: اللعبة تطلع على التلفزيون أو الآيباد وكل واحد يجاوب من تلفونه.
            🏆 بطولة الليلة: النقاط تتجمع من كل الألعاب ويتتوّج البطل.
            🧠 سين جيم بوسائل اللعبة الأصلية (الحفرة، جاوب جوابين، اتصال بصديق، استريح، الفخ) ومواضيع بالصور.
            💾 سين جيم وفاميلي فيود ينحفظون إدا سكرت التطبيق.
            📱 التاب يلف طول وعرض.
            🇧🇭 كل النصوص والأسئلة باللهجة البحرانية.
