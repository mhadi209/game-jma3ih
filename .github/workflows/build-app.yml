name: بناء التطبيق ونشره في Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: نسخ ملفات اللعبة داخل التطبيق
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r *.html *.js manifest.webmanifest icons android/app/src/main/assets/www/

      - name: بناء ملف APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: تجهيز الملفات
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/taqzeera.apk
          zip -r out/taqzeera-web.zip *.html *.js manifest.webmanifest icons

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: تقزيرة v1.${{ github.run_number }}
          make_latest: true
          files: out/*
          body: |
            ## 📲 التحميل
            - **أندرويد:** نزّل `taqzeera.apk` وافتحه، واسمح بالتثبيت من مصادر غير معروفة إذا طلب منك.
            - **نسخة الويب:** `taqzeera-web.zip` (تفتح من المتصفح).

            🇧🇭 كل النصوص والأسئلة باللهجة البحرانية.
            📱 يشتغل على الآيباد والتاب بمقاس أكبر.
            ✅ أسئلة محدثة (مونديال ٢٠٢٦ وخليجي ٢٧) ومواضيع منظفة: الأجهزة بروحها والأغراض بروحها، وكلمات بحرينية جديدة.
            🤥 لعبة جديدة: الچدبة (اكتب جواب غلط يصدقونه ودوّر الصح)، عادي وأونلاين.
            👍 كلمات وأسئلة أسهل، وخيارات الامبوستر صارت قريبة من الكلمة، وزر تغيير الكلمة والموضوع.
            🔊 أصوات ومؤثرات في كل الألعاب، و🌐 أونلاين كل واحد من تلفونه.

            حوالي ١٩٥٠ كلمة في ٢٢ موضوع، وأسئلة سين جيم في ٣٦ موضوع، ومئات الأسئلة لكل لعبة (بدون تكرار لين تخلص).
