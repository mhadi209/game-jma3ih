name: بناء التطبيق ونشره في Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: نسخ ملفات اللعبة داخل التطبيق
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html topics.js data.js manifest.webmanifest sw.js icons android/app/src/main/assets/www/

      - name: بناء ملف APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: تجهيز الملفات
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/jamaat-games.apk
          zip -r out/jamaat-games-web.zip index.html topics.js data.js manifest.webmanifest sw.js icons

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: ألعاب الجمعات v1.${{ github.run_number }}
          make_latest: true
          files: out/*
          body: |
            ## 📲 التحميل
            - **أندرويد:** نزّل `jamaat-games.apk` وافتحه، واسمح بالتثبيت من مصادر غير معروفة إذا طلب منك.
            - **نسخة الويب:** `jamaat-games-web.zip` (تفتح من المتصفح).

            14 لعبة: الامبوستر، المافيا، صراحة ولا جرأة، تمثيل، الكلمة الممنوعة، القنبلة، إنسان حيوان نبات، سين جيم، خمن الشي، الكلام المعكوس، الكرسي الساخن، لو خيروك، مين أكثر واحد، ولا مرة.
